# ============================================================
# RocketMQ Broker 配置文件
# 适用版本: Apache RocketMQ 5.3.0
# ============================================================

# ---- 集群名称 ----
brokerClusterName=DefaultCluster

# ---- Broker 名称（单机模式，全局唯一即可） ----
brokerName=broker-a

# ---- Broker ID（0 表示 Master） ----
brokerId=0

# ---- 消息删除时间（凌晨 4 点） ----
deleteWhen=04

# ---- 文件保留时间（72 小时），开发环境可适当缩短 ----
fileReservedTime=72

# ---- Broker 角色（ASYNC_MASTER = 异步复制主节点） ----
brokerRole=ASYNC_MASTER

# ---- 刷盘方式（ASYNC_FLUSH = 异步刷盘，性能优先） ----
flushDiskType=ASYNC_FLUSH

# ---- NameServer 地址（Docker 容器内通过服务名访问） ----
namesrvAddr=rocketmq-namesrv:9876

# ---- 监听端口 ----
listenPort=10911

# ---- 【重要】Broker 对外通告的 IP 地址 ----
# 由于 Broker 运行在 Docker 容器内，默认会注册容器内网 IP（如 172.x.x.x）
# 导致宿主机/外部应用无法直连。此处必须设置为虚拟机/宿主机的实际 IP。
# 部署前请修改为你的虚拟机 IP 地址，例如: 192.168.1.100
brokerIP1=192.168.100.128

# ---- 自动创建 Topic（开发环境建议开启） ----
autoCreateTopicEnable=true

# ---- 自动创建订阅组 ----
autoCreateSubscriptionGroup=true

# ---- 存储路径（使用镜像默认路径） ----
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog
storePathConsumeQueue=/home/rocketmq/store/consumequeue
storePathIndex=/home/rocketmq/store/index