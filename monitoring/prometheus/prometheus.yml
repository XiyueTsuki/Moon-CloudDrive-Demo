global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ==================== Spring Boot 后端 JVM 指标 ====================
  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8081']

  # ==================== 宿主机指标 ====================
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # ==================== Prometheus 自身指标 ====================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']