server {
    listen 80;
    server_name localhost;

    charset utf-8;
    client_max_body_size 500m;

    # Docker 内置 DNS，让 nginx 动态解析容器服务名
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端（使用变量使 proxy_pass 动态解析 DNS）
    location /api/ {
        set $backend_api "backend:8080";
        proxy_pass http://$backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Actuator 健康检查（仅内部访问）
    location /actuator/ {
        set $backend_actuator "backend:8081";
        proxy_pass http://$backend_actuator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger / Knife4j 接口文档
    location /swagger-ui/ {
        set $backend_swagger "backend:8080";
        proxy_pass http://$backend_swagger;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v3/api-docs {
        set $backend_docs "backend:8080";
        proxy_pass http://$backend_docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态资源缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;
}