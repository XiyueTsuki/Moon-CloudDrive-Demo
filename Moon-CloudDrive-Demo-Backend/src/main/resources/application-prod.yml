# ========== Docker 环境配置覆盖 ==========
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/Moon-CloudDrive-Demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
  data:
    redis:
      host: redis
      port: 6379

# ========== RocketMQ Docker 覆盖 ==========
rocketmq:
  namesrv-addr: rocketmq-namesrv:9876

# ========== MyBatis-Plus 生产环境关闭 SQL 日志 ==========
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# ========== Actuator 健康检查监控配置（生产环境） ==========
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  server:
    port: 8081