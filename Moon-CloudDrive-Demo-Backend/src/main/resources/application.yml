app:
  host: ${APP_HOST:192.168.100.128}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: Moon-CloudDrive-Demo
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:mysql://${app.host}:4000/Moon-CloudDrive-Demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${app.host}
      port: 4001
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true
            required: true

mybatis-plus:
  configuration:
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-header: true
  is-read-cookie: false

logging:
  level:
    com.zaxxer.hikari: INFO
    org.springframework.boot.autoconfigure.jdbc: INFO

aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: moon-clouddrive-demo

# ========== 分片上传配置 ==========
moon:
  preview:
    pdf:
      dpi: 150
      max-width: 1920
      image-format: png
      convert-timeout: 30
      font-dir: classpath:fonts/
  chunk:
    upload:
      chunk-size: 5242880
  pack:
    max-file-count: 50
    max-total-size: 536870912 #512MB
    zip-expire-minutes: 30

# ========== RocketMQ 配置 ==========
rocketmq:
  namesrv-addr: ${app.host}:9876
  producer:
    group: pack-download-producer-group
    send-msg-timeout: 3000
  consumer:
    pack-download:
      group: pack-download-consumer-group
      max-reconsume-times: 3
    pack-cleanup:
      group: pack-cleanup-consumer-group

# ========== Knife4j / SpringDoc 接口文档配置 ==========
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.xiyuetsuki.moonclouddrivedemo.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    enable-version: true